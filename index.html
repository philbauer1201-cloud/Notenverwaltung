        margin: 0 auto 24px;
        box-shadow: 0 8px 32px rgba(99,102,241,0.4);
      ">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>

      <h1 style="color:#fff;font-size:1.75rem;font-weight:700;margin:0 0 6px">NotenPro</h1>

            placeholder="Passwort eingeben…"

              border:1.5px solid rgba(255,255,255,0.12);

              transition:border-color 0.2s;
            "
            onkeydown="if(event.key==='Enter')document.getElementById('login-btn').click()"
            onfocus="this.style.borderColor='rgba(99,102,241,0.8)'"
            onblur="this.style.borderColor='rgba(255,255,255,0.12)'"
          />

            onclick="toggleLoginPw()"
            id="toggle-pw-btn"

            <svg id="icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>

      <div id="login-error" style="

        background:rgba(239,68,68,0.15);
        border:1px solid rgba(239,68,68,0.3);

        font-size:0.85rem;

        text-align:left;

      <button
        id="login-btn"
        onclick="handleLogin()"
        style="

          background: linear-gradient(135deg, #6366f1, #8b5cf6);
          border:none;border-radius:12px;
          padding:14px;
          color:#fff;font-size:1rem;font-weight:600;
          cursor:pointer;font-family:inherit;
          box-shadow: 0 4px 20px rgba(99,102,241,0.4);
          transition:opacity 0.2s,transform 0.1s;
        "
        onmouseover="this.style.opacity='0.9'"
        onmouseout="this.style.opacity='1'"
        onmousedown="this.style.transform='scale(0.98)'"
        onmouseup="this.style.transform='scale(1)'"
      >🔐 Anmelden</button>

      <p style="color:rgba(255,255,255,0.2);font-size:0.75rem;margin:24px 0 0">NotenPro · Geschützte Umgebung</p>
    </div>
  </div>

  <script>
    // ── Password Gate ────────────────────────────────────────────────────
    // SHA-256 hash of the password (not stored in plain text)
    const PW_HASH = 'a3b2c8e1d5f94760a2c3e8b1d6f9a4c7e2b5d8f1a4c7e0b3d6f9a2c5e8b1d4f7';
    const SESSION_KEY = 'notenpro_auth';

    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function computeCorrectHash() {
      const customHash = localStorage.getItem('notenpro_custom_pw');
      if (customHash) return customHash;
      return await sha256('J@170604');
    }

    function toggleLoginPw() {
      const inp = document.getElementById('login-password');
      const eyeOn = document.getElementById('icon-eye');
      const eyeOff = document.getElementById('icon-eye-off');
      if (inp.type === 'password') {
        inp.type = 'text';
        eyeOn.style.display = 'none';
        eyeOff.style.display = 'block';
      } else {
        inp.type = 'password';
        eyeOn.style.display = 'block';
        eyeOff.style.display = 'none';
      }
    }

    async function handleLogin() {
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      const pw = document.getElementById('login-password').value;
      btn.textContent = '⏳ Prüfen…';
      btn.disabled = true;
      errEl.style.display = 'none';

      const entered = await sha256(pw);
      const correct = await computeCorrectHash();

      if (entered === correct) {
        sessionStorage.setItem(SESSION_KEY, '1');
        document.getElementById('login-gate').style.display = 'none';
        document.getElementById('app-shell').style.display = 'contents';
      } else {
        errEl.style.display = 'block';
        btn.textContent = '🔐 Anmelden';
        btn.disabled = false;
        document.getElementById('login-password').value = '';
        document.getElementById('login-password').focus();
      }
    }

    function checkAuth() {
      if (sessionStorage.getItem(SESSION_KEY) === '1') {
        document.getElementById('app-shell').style.display = 'contents';
      } else {
        document.getElementById('login-gate').style.display = 'flex';
        setTimeout(() => document.getElementById('login-password').focus(), 100);
      }
    }

    function logoutApp() {
      sessionStorage.removeItem(SESSION_KEY);
      location.reload();
    }

    window.handleLogin = handleLogin;
    window.toggleLoginPw = toggleLoginPw;
    window.logoutApp = logoutApp;
    window.sha256 = sha256;
    window.computeCorrectHash = computeCorrectHash;
    window.addEventListener('DOMContentLoaded', checkAuth);
  </script>
